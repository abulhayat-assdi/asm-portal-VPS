# ============================================================
# Student Sites — Wildcard Nginx Configuration
# VPS path: /etc/nginx/sites-available/student-sites
# (or /etc/nginx/conf.d/student-sites.conf if using Coolify)
# ============================================================
#
# Prerequisites:
# 1. DNS wildcard A record: * → <VPS_IP>
# 2. Wildcard SSL cert via certbot DNS-01:
#    sudo certbot certonly --dns-cloudflare \
#      --dns-cloudflare-credentials /etc/letsencrypt/cloudflare.ini \
#      -d "tasm-skill.asf.bd" -d "*.tasm-skill.asf.bd"
#
# 3. Student sites dir exists and is writable by Docker container:
#    sudo mkdir -p /var/www/student-sites
#    sudo chown -R 1001:1001 /var/www/student-sites
#
# 4. Enable this file:
#    sudo ln -s /etc/nginx/sites-available/student-sites /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── HTTPS: wildcard subdomain handler ───────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Regex: matches *.tasm-skill.asf.bd
    # Captures the subdomain name into $subdomain variable
    server_name ~^(?<subdomain>[a-z0-9][a-z0-9-]{1,62})\.tasm-skill\.asf\.bd$;

    ssl_certificate     /etc/letsencrypt/live/tasm-skill.asf.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasm-skill.asf.bd/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Serve student files from disk
    root  /var/www/student-sites/$subdomain;
    index index.html;

    # Try file → directory → fallback to index.html (SPA support)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"  always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # Block access to hidden files (e.g. .htaccess, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Performance: cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 404 handling — serve student's own 404.html if it exists
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Access log per-subdomain (optional, can be disabled to save disk)
    # access_log /var/log/nginx/student-sites-access.log;
}

# ── HTTP → HTTPS redirect for student subdomains ────────────
server {
    listen 80;
    listen [::]:80;

    server_name ~^(?<subdomain>[a-z0-9][a-z0-9-]{1,62})\.tasm-skill\.asf\.bd$;

    return 301 https://$host$request_uri;
}

# ============================================================
# IMPORTANT: This wildcard block must be AFTER (or in a lower
# priority file than) any explicit server blocks for:
#   - tasm-skill.asf.bd        (main portal → proxy 3000)
#   - www.tasm-skill.asf.bd    (main portal → proxy 3000)
#   - coolify.tasm-skill.asf.bd (Coolify panel)
#
# In Nginx, exact server_name matches always beat regex matches,
# so the above should work without issues. But if not, rename
# this file to start with 'z_' (e.g. z_student-sites) so it
# loads last alphabetically.
# ============================================================
