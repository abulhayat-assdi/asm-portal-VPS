services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-asm_portal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Runs once at startup to ensure the storage volume is owned by UID 1001 (nextjs).
  # Needed because Docker named volumes are root-owned on first creation.
  init-storage:
    image: alpine
    command: sh -c "mkdir -p /storage && chown -R 1001:1001 /storage"
    volumes:
      - storage_data:/storage
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-mypassword}@db:5432/${DB_NAME:-asm_portal}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      LOCAL_STORAGE_PATH: /app/storage
      NEXT_PUBLIC_BASE_DOMAIN: ${NEXT_PUBLIC_BASE_DOMAIN:-tasm-skill.asf.bd}
      SAAS_OWNER_EMAIL: ${SAAS_OWNER_EMAIL}
      STUDENT_SITES_PATH: ${STUDENT_SITES_PATH:-/var/www/student-sites}
      MAX_DEPLOY_SIZE_MB: ${MAX_DEPLOY_SIZE_MB:-50}
    depends_on:
      db:
        condition: service_started
      init-storage:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage
      - /var/www/student-sites:/var/www/student-sites   # Student site hosting (bind mount)

volumes:
  postgres_data:
  storage_data:
